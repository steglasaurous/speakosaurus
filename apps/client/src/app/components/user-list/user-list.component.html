<div class="container">
  <div class="header">
    <div class="header-content">
      <h1>Users</h1>
      <p class="subtitle">Manage user voices, TTS names, and custom intros</p>
    </div>
    <a [routerLink]="['/settings']" class="settings-button" title="Settings">
      <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
      </svg>
    </a>
  </div>

  <div class="search-bar">
    <div class="search-input-wrapper">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <input
        type="text"
        class="search-input"
        placeholder="Search users by Twitch username or TTS name..."
        [(ngModel)]="searchQuery"
        (input)="filterUsers()"
      >
    </div>
  </div>

  <div class="users-list">
    <div *ngIf="filteredUsers.length === 0" class="empty-state">
      <div class="empty-state-icon">👤</div>
      <p>No users found</p>
    </div>
    <a
      *ngFor="let user of filteredUsers"
      [routerLink]="['/users', user.twitchUserId]"
      class="user-item"
    >
      <div class="user-info">
        <div class="user-name">{{ user.twitchUsername }}</div>
        <div class="user-details">
          <div class="user-detail-item">
            <span>TTS Name:</span>
            <strong>{{ user.ttsName || 'Not set' }}</strong>
          </div>
          <div class="user-detail-item">
            <span>Voice:</span>
            <span [class.badge]="true" [class.voice]="user.ttsVoiceId" [class]="{'badge': true, 'voice': user.ttsVoiceId}">
              {{ getVoiceDisplayName(user) }}
            </span>
          </div>
          <div class="user-detail-item">
            <span>Intros:</span>
            <strong>{{ getIntroCount(user) }}</strong>
          </div>
        </div>
      </div>
      <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </a>
  </div>
</div>
