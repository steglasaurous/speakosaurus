<div class="status-bar">
  <div class="status-item">
    <span class="status-label">Streamer.bot:</span>
    <span [class.connected]="status.streamerBotConnected" [class.disconnected]="!status.streamerBotConnected" class="status-indicator">
      {{ status.streamerBotConnected ? 'Connected' : 'Disconnected' }}
    </span>
  </div>

  <div class="status-item">
    <span class="status-label">Render Queue:</span>
    <span class="status-value">{{ status.pendingMessages }}</span>
  </div>
  <div class="status-item">
    <span class="status-label">Play Queue:</span>
    <span class="status-value">{{ status.audioQueueSize }}</span>
  </div>

  <div class="right-controls">
    <button class="stop-button" (click)="onStopClicked()" [disabled]="stopInProgress" title="Stop all speech">
      Stop
    </button>

    <div class="status-item mode-selector">
      <span class="status-label">Mode:</span>
      <select
        [value]="status.mode"
        (change)="onModeChange($any($event.target).value)"
        class="mode-select"
        >
        @for (option of modeOptions; track option) {
          <option [value]="option">
            {{ option }}
          </option>
        }
      </select>
    </div>
  </div>

  <button type="button" class="settings-button" title="Voice playground" (click)="playgroundRequested.emit()">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="vertical-align: middle;">
      <g>
        <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
        <circle cx="8" cy="12" r="2" fill="currentColor"/>
        <rect x="13" y="10" width="4" height="4" rx="1" fill="currentColor"/>
        <rect x="7" y="7" width="2" height="2" rx="1" fill="currentColor"/>
        <rect x="15" y="7" width="2" height="2" rx="1" fill="currentColor"/>
      </g>
    </svg>
    <span style="margin-left: 6px; vertical-align: middle;">Voice Playground</span>
  </button>

  <button type="button" class="settings-button" title="Settings" (click)="settingsRequested.emit()">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826 3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
    </svg>
  </button>
</div>
