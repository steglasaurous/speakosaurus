<div class="playground" role="document" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
  <header class="playground-header">
    <h2>Voice Playground</h2>
    <span class="current-chip" *ngIf="selectedVoice">
      {{ selectedVoice.voiceName }} · {{ selectedVoice.providerName }}
      <ng-container *ngIf="selectedVoice.isCustom"> · custom</ng-container>
    </span>
    <span class="current-chip" *ngIf="!selectedVoice">No voice selected</span>
    <button type="button" class="icon-btn" (click)="requestClose()" aria-label="Close">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </header>

  <div class="playground-body">
    <div class="picker-pane">
      <app-voice-selector
        layout="embedded"
        [selectedVoice]="selectedVoice"
        [previewMessage]="sampleText"
        [previewTweaks]="tweaks"
        [tweaksVoice]="selectedVoice"
        [showLabel]="false"
        inputId="playground-voice"
        (voiceSelected)="onVoiceSelected($event)"
      ></app-voice-selector>
    </div>

    <aside class="tweaks-pane">
      <div class="tweaks-scroll">
        <div>
          <div class="section-label">Sample text</div>
          <textarea [(ngModel)]="sampleText" rows="4"></textarea>
          <button
            type="button"
            class="btn btn-primary"
            [disabled]="!selectedVoice || playingSelected || selectedVoice.needsDownload"
            (click)="playSelected()"
          >
            {{ playingSelected ? 'Playing…' : 'Play selected voice' }}
          </button>
        </div>

        <app-voice-tweaks
          [providerName]="selectedVoice?.providerName ?? null"
          [supportedStyles]="supportedStyles"
          [tweaks]="tweaks"
          (tweaksChange)="onTweaksChange($event)"
        ></app-voice-tweaks>
      </div>

      <div class="tweaks-footer">
        <div>
          <div class="section-label">Save as customized voice</div>
          <input
            class="name-input"
            type="text"
            [(ngModel)]="customName"
            placeholder="Voice name"
          >
        </div>
        <div class="footer-actions">
          <button
            type="button"
            class="btn btn-primary"
            [disabled]="!selectedVoice || saving"
            (click)="saveCustomVoice()"
          >
            {{ saving ? 'Saving…' : saveLabel }}
          </button>
          <button
            *ngIf="selectedVoice?.isCustom"
            type="button"
            class="btn btn-danger"
            [disabled]="deleting"
            (click)="deleteCustomVoice()"
          >
            {{ deleting ? 'Deleting…' : 'Delete' }}
          </button>
        </div>
        <p class="status" *ngIf="statusMessage">{{ statusMessage }}</p>
        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      </div>
    </aside>
  </div>
</div>
