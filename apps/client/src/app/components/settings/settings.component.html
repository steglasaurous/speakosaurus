<div class="container">
  <div class="header">
    <div class="header-left">
      <a class="back-button" [routerLink]="['/users']">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </a>
      <h1>Settings</h1>
    </div>
    <button 
      class="save-all-button" 
      (click)="saveAllSettings()" 
      [disabled]="saving || loading"
    >
      {{ saving ? 'Saving...' : 'Save All' }}
    </button>
  </div>

  <div *ngIf="loading" class="loading-state">
    <p>Loading settings...</p>
  </div>

  <div *ngIf="error" class="error-state">
    <p>{{ error }}</p>
  </div>

  <div *ngIf="successMessage" class="success-state">
    <p>{{ successMessage }}</p>
  </div>

  <div *ngIf="!loading && groupedSettings.length > 0" class="settings-content">
    <div class="tabs">
      <button
        *ngFor="let group of groupedSettings"
        class="tab-button"
        [class.active]="activeTab === group.group"
        (click)="activeTab = group.group"
      >
        {{ group.group }}
      </button>
    </div>

    <div class="tab-content">
      <div *ngFor="let setting of getSettingsForActiveTab()" class="setting-item">
        <div class="setting-header">
          <label [for]="'setting-' + setting.name" class="setting-label">
            {{ setting.displayName }}
            <span *ngIf="setting.required" class="required-indicator">*</span>
          </label>
          <button
            class="save-setting-button"
            (click)="saveSetting(setting)"
            [disabled]="saving"
          >
            Save
          </button>
        </div>
        <p class="setting-description">{{ setting.description }}</p>

        <!-- STRING type -->
        <div *ngIf="setting.type === 'string'" class="form-group">
          <input
            type="text"
            [id]="'setting-' + setting.name"
            class="form-input"
            [value]="getSettingValue(setting)"
            (input)="onSettingChange(setting, $any($event.target).value)"
            [placeholder]="setting.default || ''"
          >
        </div>

        <!-- NUMBER type -->
        <div *ngIf="setting.type === 'number'" class="form-group">
          <input
            type="number"
            [id]="'setting-' + setting.name"
            class="form-input"
            [value]="getSettingValue(setting)"
            (input)="onSettingChange(setting, $any($event.target).value)"
            [placeholder]="setting.default || ''"
          >
        </div>

        <!-- BOOLEAN type -->
        <div *ngIf="setting.type === 'boolean'" class="form-group">
          <label class="checkbox-label">
            <input
              type="checkbox"
              [id]="'setting-' + setting.name"
              [checked]="getSettingValue(setting) === 'true'"
              (change)="onSettingChange(setting, $any($event.target).checked)"
            >
            <span>{{ getSettingValue(setting) === 'true' ? 'Enabled' : 'Disabled' }}</span>
          </label>
        </div>

        <!-- ENUM type -->
        <div *ngIf="setting.type === 'enum' && setting.options" class="form-group">
          <select
            [id]="'setting-' + setting.name"
            class="form-select"
            [value]="getSettingValue(setting)"
            (change)="onSettingChange(setting, $any($event.target).value)"
          >
            <option *ngFor="let option of setting.options" [value]="option">
              {{ option }}
            </option>
          </select>
        </div>

        <!-- ARRAY type -->
        <div *ngIf="setting.type === 'array'" class="form-group">
          <div class="array-items">
            <div
              *ngFor="let item of parseArrayValue(setting); let i = index; trackBy: trackByIndex"
              class="array-item"
            >
              <input
                type="text"
                class="form-input array-input"
                [ngModel]="item"
                (ngModelChange)="updateArrayItem(setting, i, $event)"
                [placeholder]="'Item ' + (i + 1)"
              >
              <button
                class="remove-array-item-button"
                (click)="removeArrayItem(setting, i)"
                type="button"
              >
                Remove
              </button>
            </div>
            <button
              class="add-array-item-button"
              (click)="addArrayItem(setting)"
              type="button"
            >
              + Add Item
            </button>
          </div>
        </div>

        <!-- JSON type -->
        <div *ngIf="setting.type === 'json'" class="form-group">
          <textarea
            [id]="'setting-' + setting.name"
            class="form-textarea"
            [value]="getSettingValue(setting)"
            (input)="onSettingChange(setting, $any($event.target).value)"
            rows="4"
            placeholder="Enter JSON..."
          ></textarea>
        </div>

        <!-- VOICE type -->
        <div *ngIf="setting.type === 'voice'">
          <app-voice-selector
            [selectedVoice]="selectedVoices[setting.name]"
            [inputId]="'setting-' + setting.name"
            [showLabel]="false"
            (voiceSelected)="onVoiceSelected(setting, $event)"
          >
          </app-voice-selector>
        </div>

        <!-- USER_LIST type -->
        <div *ngIf="setting.type === 'userList'" class="form-group">
          <div class="user-list-container">
            <!-- Current users list -->
            <div class="user-list-items">
              <div
                *ngFor="let username of parseUserListValue(setting); let i = index; trackBy: trackByIndex"
                class="user-list-item"
              >
                <span class="user-list-username">{{ username }}</span>
                <button
                  class="remove-user-button"
                  (click)="removeUserFromList(setting, i)"
                  type="button"
                  title="Remove user"
                >
                  ×
                </button>
              </div>
            </div>

            <!-- Auto-complete input -->
            <div class="user-list-autocomplete-wrapper">
              <input
                type="text"
                class="form-input user-list-search-input"
                [id]="'setting-' + setting.name + '-search'"
                [value]="userListSearchQueries[setting.name] || ''"
                (input)="onUserListSearchInput(setting, $any($event.target).value)"
                (focus)="onUserListFocus(setting)"
                (blur)="onUserListBlur(setting)"
                placeholder="Search for Twitch users..."
              >
              <div *ngIf="userListSearching[setting.name]" class="user-list-loading">
                <div class="spinner-small"></div>
              </div>

              <!-- Dropdown results -->
              <div
                *ngIf="userListShowDropdown[setting.name] && ((userListLocalUsers[setting.name] && userListLocalUsers[setting.name].length > 0) || (userListSearchResults[setting.name] && userListSearchResults[setting.name].length > 0))"
                class="user-list-dropdown"
                [class.user-list-dropdown-above]="userListDropdownAbove[setting.name]"
              >
                <!-- Local users group -->
                <div *ngIf="userListLocalUsers[setting.name] && userListLocalUsers[setting.name].length > 0" class="user-list-group">
                  <div class="user-list-group-header">Users in System</div>
                  <div
                    *ngFor="let user of userListLocalUsers[setting.name]"
                    class="user-list-dropdown-item"
                    (mousedown)="addLocalUserToList(setting, user); $event.preventDefault()"
                  >
                    <div class="user-list-dropdown-info">
                      <div class="user-list-dropdown-name">{{ user.twitchUsername }}</div>
                      <div *ngIf="user.ttsName && user.ttsName !== user.twitchUsername" class="user-list-dropdown-login">{{ user.ttsName }}</div>
                    </div>
                  </div>
                </div>

                <!-- Twitch users group -->
                <div *ngIf="userListSearchResults[setting.name] && userListSearchResults[setting.name].length > 0" class="user-list-group">
                  <div class="user-list-group-header">Twitch Users</div>
                  <div
                    *ngFor="let twitchUser of userListSearchResults[setting.name]"
                    class="user-list-dropdown-item"
                    (mousedown)="addUserToList(setting, twitchUser); $event.preventDefault()"
                  >
                    <img
                      *ngIf="twitchUser.profile_image_url"
                      [src]="twitchUser.profile_image_url"
                      [alt]="twitchUser.display_name"
                      class="user-list-avatar"
                    >
                    <div class="user-list-dropdown-info">
                      <div class="user-list-dropdown-name">{{ twitchUser.display_name }}</div>
                      <div class="user-list-dropdown-login">&#64;{{ twitchUser.login }}</div>
                    </div>
                  </div>
                </div>
              </div>
              <div
                *ngIf="userListShowDropdown[setting.name] && !userListSearching[setting.name] && (!userListLocalUsers[setting.name] || userListLocalUsers[setting.name].length === 0) && (!userListSearchResults[setting.name] || userListSearchResults[setting.name].length === 0) && (userListSearchQueries[setting.name] || '').trim().length > 0"
                class="user-list-dropdown-empty"
                [class.user-list-dropdown-above]="userListDropdownAbove[setting.name]"
              >
                No users found
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
