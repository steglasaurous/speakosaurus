<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Speakosaurus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #86868b;
            font-size: 14px;
        }

        .search-bar {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .search-input-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #86868b;
            width: 20px;
            height: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 48px;
            border: 2px solid #e5e5e7;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #007aff;
        }

        .users-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .user-item {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e5e7;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .user-item:hover {
            background: #f5f5f7;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .user-details {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: #86868b;
        }

        .user-detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            background: #e5e5e7;
            color: #1d1d1f;
        }

        .badge.voice {
            background: #007aff;
            color: white;
        }

        .chevron {
            color: #86868b;
            width: 24px;
            height: 24px;
        }

        .empty-state {
            padding: 64px 24px;
            text-align: center;
            color: #86868b;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Users</h1>
            <p class="subtitle">Manage user voices, TTS names, and custom intros</p>
        </div>

        <div class="search-bar">
            <div class="search-input-wrapper">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Search users by Twitch username or TTS name..."
                >
            </div>
        </div>

        <div class="users-list">
            <div class="user-item">
                <div class="user-info">
                    <div class="user-name">xQc</div>
                    <div class="user-details">
                        <div class="user-detail-item">
                            <span>TTS Name:</span>
                            <strong>Felix</strong>
                        </div>
                        <div class="user-detail-item">
                            <span>Voice:</span>
                            <span class="badge voice">ElevenLabs - Rachel</span>
                        </div>
                        <div class="user-detail-item">
                            <span>Intros:</span>
                            <strong>3</strong>
                        </div>
                    </div>
                </div>
                <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </div>

            <div class="user-item">
                <div class="user-info">
                    <div class="user-name">pokimane</div>
                    <div class="user-details">
                        <div class="user-detail-item">
                            <span>TTS Name:</span>
                            <strong>Imane</strong>
                        </div>
                        <div class="user-detail-item">
                            <span>Voice:</span>
                            <span class="badge voice">SpeakerTTS - Emma</span>
                        </div>
                        <div class="user-detail-item">
                            <span>Intros:</span>
                            <strong>1</strong>
                        </div>
                    </div>
                </div>
                <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </div>

            <div class="user-item">
                <div class="user-info">
                    <div class="user-name">shroud</div>
                    <div class="user-details">
                        <div class="user-detail-item">
                            <span>TTS Name:</span>
                            <strong>Michael</strong>
                        </div>
                        <div class="user-detail-item">
                            <span>Voice:</span>
                            <span class="badge">Not set</span>
                        </div>
                        <div class="user-detail-item">
                            <span>Intros:</span>
                            <strong>0</strong>
                        </div>
                    </div>
                </div>
                <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </div>

            <div class="user-item">
                <div class="user-info">
                    <div class="user-name">ninja</div>
                    <div class="user-details">
                        <div class="user-detail-item">
                            <span>TTS Name:</span>
                            <strong>Tyler</strong>
                        </div>
                        <div class="user-detail-item">
                            <span>Voice:</span>
                            <span class="badge voice">ElevenLabs - Adam</span>
                        </div>
                        <div class="user-detail-item">
                            <span>Intros:</span>
                            <strong>2</strong>
                        </div>
                    </div>
                </div>
                <svg class="chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
